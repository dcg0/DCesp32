name: Firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tooling syntax
        shell: bash
        run: |
          bash -n trabajo-0.7.0-remaster/herramientas/*.sh
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('trabajo-0.7.0-remaster/herramientas').glob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check API routes and data contract
        run: python3 trabajo-0.7.0-remaster/herramientas/verificar_api.py

      - name: Test DTC and VIN parsers
        run: bash trabajo-0.7.0-remaster/herramientas/test_parsers.sh

      - name: Check embedded firmware JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('trabajo-0.7.0-remaster/ESP32-OBDC2/ESP32-OBDC2.ino').read_text(encoding='utf-8')
          page = source.split('R"HTML(', 1)[1].split(')HTML";', 1)[0]
          js = page.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/dcesp32-firmware-page.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/dcesp32-firmware-page.js

      - name: Check demo page JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          if html.count('<script>') != 1:
              raise SystemExit('Se esperaba un bloque JavaScript en index.html')
          js = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/dcesp32-demo.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/dcesp32-demo.js
